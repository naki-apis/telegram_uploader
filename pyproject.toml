[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram_uploader"
version = "0.1.0"
description = "Upload files to Telegram via Pyrogram"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = []
dependencies = [
    "pyrogram",
    "tgcrypto",
]

[project.scripts]
tg-tool = "telegram_uploader.cli:main"

[tool.setuptools.packages.find]
include = ["telegram_uploader*"]
